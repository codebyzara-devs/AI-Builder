<style>
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .shimmer-bar {
            background: linear-gradient(90deg, #E2E8F0 25%, #F1F5F9 50%, #E2E8F0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite linear;
        }
        .fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo-pulse {
            animation: pulse-slow 3s infinite ease-in-out;
        }
        @keyframes pulse-slow {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.03); opacity: 0.95; }
        }
        body {
            background-color: #F8FAFC;
            overflow: hidden;
        }
    </style>

<body class="flex flex-col items-center justify-center min-h-screen">
<!-- Splash Screen Container -->
<main class="relative flex flex-col items-center justify-center w-full h-full max-w-md mx-auto px-lg">

<!-- Subtle glow effect behind logo -->

                    SkillBridge AI

</div>

<!-- Loading Indicator -->

<div class="relative h-1 w-full bg-surface-container-highest rounded-full overflow-hidden">
<div class="shimmer-bar absolute top-0 left-0 h-full w-full"></div>
</div>
<p class="font-label-sm text-label-sm text-on-surface-variant text-center mt-md tracking-widest uppercase">
                Synchronizing Profile

<!-- Footnote / Versioning (Subtle) -->

<span class="font-label-sm text-label-sm text-secondary">

</div>

<!-- Background Atmospheric Effect (Subtle Gradient) -->

<div class="absolute top-0 left-0 w-full h-full bg-[radial-gradient(circle_at_top_right,_var(--tw-gradient-stops))] from-primary/5 via-transparent to-transparent"></div>
<div class="absolute bottom-0 right-0 w-full h-full bg-[radial-gradient(circle_at_bottom_left,_var(--tw-gradient-stops))] from-secondary/5 via-transparent to-transparent"></div>
</div>
<script>
        // Micro-interaction: Subtle mouse movement effect for the logo area
        document.addEventListener('mousemove', (e) => {
            const logo = document.querySelector('.logo-pulse');
            if (logo) {
                const xAxis = (window.innerWidth / 2 - e.pageX) / 45;
                const yAxis = (window.innerHeight / 2 - e.pageY) / 45;
                logo.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
            }
        });

        // Simulate splash screen timeout to transition (optional visual logic)
        window.addEventListener('load', () => {
            // In a real app, this would trigger a router redirect after assets load
            console.log('SkillBridge AI Environment Ready');
        });
    </script>
